name: flutter_final_project
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.3.0
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
  - assets/icons/
  - assets/images/
  fonts:
  - family: ManropeBold
    fonts: 
    - asset: assets/fonts/manrope_bold.ttf
  - family: ManropeSemiBold
    fonts: 
    - asset: assets/fonts/manrope_semi_bold.ttf
  - family: ManropeRegular
    fonts: 
    - asset: assets/fonts/manrope_regular.ttf
  - family: ManropeLight
    fonts: 
    - asset: assets/fonts/manrope_light.ttf
